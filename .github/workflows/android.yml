name: Android APK/AAB yig'ish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          # DIQQAT: bu yerga ilova ichida ochiladigan HAR BIR fayl kirishi shart.
          # Avval faqat 3 ta HTML ko'chirilardi va natijada APK ichida
          # assets/ (splash, karta, to'lov logolari, onboarding rasmlari...)
          # umuman bo'lmasdi, delete-account.html esa ochilmasdi.
          cp index.html privacy-policy.html terms-of-service.html terms.html delete-account.html manifest.json www/
          cp -r assets www/
          # stat-cards-premium.png / daily-bonus-banner.png / lucky-wheel-home-banner.png /
          # lucky-wheel-modal.png — bosh sahifadagi kartalar va g'ildirak modali
          # uchun HAQIQIY fon rasmlari (background-image), shuning uchun
          # boshqa har qanday assets/ fayli kabi APK ichiga kiradi.

      - name: Verify web assets
        run: |
          set -e
          for f in index.html privacy-policy.html terms-of-service.html terms.html delete-account.html manifest.json; do
            test -s "www/$f" || { echo "YO'Q: www/$f"; exit 1; }
          done
          # index.html ichidagi barcha lokal havolalar www/ da mavjudligini tekshiramiz
          python3 - <<'PY'
          import re, os, sys
          missing = []
          for page in ['index.html','privacy-policy.html','terms-of-service.html','delete-account.html']:
              s = open(os.path.join('www', page), encoding='utf-8').read()
              for m in re.finditer(r'''(?:src|href)\s*=\s*["']([^"'#]+)["']|url\(\s*['"]?([^)'"]+?)['"]?\s*\)''', s):
                  u = (m.group(1) or m.group(2) or '').strip()
                  if not u or '${' in u: continue
                  if u.startswith(('http://','https://','//','data:','about:','mailto:','tel:','javascript:','#')): continue
                  if not os.path.exists(os.path.join('www', u)):
                      missing.append(f'{page} -> {u}')
          if missing:
              print('www/ da yetishmayotgan fayllar:')
              for x in missing: print('  -', x)
              sys.exit(1)
          print('www/ to\'liq — barcha lokal havolalar joyida')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskUp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release AAB (Play Market uchun, imzosiz)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: TaskUp-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
